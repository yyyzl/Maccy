name: Compare capture context lifetime with synthetic SwiftData

on:
  push:
    branches: ['memory-native/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the standalone inverse-relationship probe
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          mkdir -p "$RUNNER_TEMP/capture-probe"
          sw_vers > "$RUNNER_TEMP/capture-probe/host.txt"
          uname -m >> "$RUNNER_TEMP/capture-probe/host.txt"
          git rev-parse HEAD >> "$RUNNER_TEMP/capture-probe/host.txt"
          xcrun swiftc -O tests-cli/swiftdata-capture/main.swift -o "$RUNNER_TEMP/probe"
          echo '<plist version="1.0"><dict><key>com.apple.security.get-task-allow</key><true/></dict></plist>' > "$RUNNER_TEMP/probe-entitlements.plist"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/probe-entitlements.plist" "$RUNNER_TEMP/probe"
      - name: Measure main and short writer contexts
        run: |
          set -euo pipefail
          for mode in main writer rollback; do
            root=$(mktemp -d "$RUNNER_TEMP/capture-$mode.XXXXXX")
            "$RUNNER_TEMP/probe" "$mode" "$root/store.sqlite" > "$RUNNER_TEMP/capture-probe/$mode.log" 2>&1 &
            probe_pid=$!
            for _ in {1..60}; do
              if grep -q 'PROBE_READY' "$RUNNER_TEMP/capture-probe/$mode.log"; then break; fi
              kill -0 "$probe_pid"
              sleep 1
            done
            grep -q 'PROBE_READY' "$RUNNER_TEMP/capture-probe/$mode.log"
            footprint "$probe_pid" > "$RUNNER_TEMP/capture-probe/$mode-footprint-0.txt"
            sleep 15
            footprint "$probe_pid" > "$RUNNER_TEMP/capture-probe/$mode-footprint-15.txt"
            heap -s --noContent -H "$probe_pid" > "$RUNNER_TEMP/capture-probe/$mode-heap.txt" 2>&1 || true
            kill -TERM "$probe_pid"
            wait "$probe_pid" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swiftdata-capture-probe-${{ matrix.arch }}
          path: ${{ runner.temp }}/capture-probe/
          retention-days: 7

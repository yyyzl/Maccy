name: Measure the previous lifecycle source on ARM macOS 26

on:
  push:
    branches: ['memory-native/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        label: [endurance]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Record the native supplemental host and exact binary source
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/memory-results"
          {
            sw_vers
            uname -m
            sysctl -n hw.memsize
            git rev-parse HEAD
            echo 'Binary source: f1f9b136af33957ac6c527004616778af80e389e; production 0dddf7f; build run 41724342920'
            echo 'Supplemental macOS 26 evidence; cannot substitute for macOS 15'
            swift -e 'import AppKit; print("Screen:", NSScreen.main?.frame as Any, "scale:", NSScreen.main?.backingScaleFactor as Any)'
          } | tee "$RUNNER_TEMP/memory-results/host.txt"
      - name: Verify and sign the existing isolated ARM64 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/candidate"
          mkdir -p "$destination"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13274461421/zip" > "$destination/artifact.zip"
          echo "a5ce1c9e5b61327aa6d44ee3f11b61028d47b6dba65492aac2f3d0ace390f6e7  $destination/artifact.zip" | shasum -a 256 -c -
          ditto -x -k "$destination/artifact.zip" "$destination"
          ditto -x -k "$destination/Maccy-window.zip" "$destination"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$destination/Maccy.app/Contents/Info.plist")" = org.yyyzl.MaccyMemoryLifecycle
          lipo "$destination/Maccy.app/Contents/MacOS/Maccy" -verify_arch arm64
          sed 's/$(PRODUCT_BUNDLE_IDENTIFIER)/org.yyyzl.MaccyMemoryLifecycle/g' Maccy/Maccy.entitlements > "$destination/entitlements.plist"
          codesign --force --deep --sign - --pagesize 16384 --options runtime \
            --entitlements "$destination/entitlements.plist" "$destination/Maccy.app"
          codesign --verify --deep --strict "$destination/Maccy.app"
      - name: Verify the contracts and twelve real-window cycles first
        run: |
          set -euo pipefail
          for scenario in contracts interaction; do
            set +e
            bash tests-cli/lifecycle/run.sh "$RUNNER_TEMP/candidate/Maccy.app" candidate "$scenario" | tee "$RUNNER_TEMP/memory-results/$scenario-console.log"
            set -e
            directory=$(sed -n 's/^Results: //p' "$RUNNER_TEMP/memory-results/$scenario-console.log" | head -1)
            [[ "$directory" =~ ^/tmp/maccy-lifecycle-results\.[A-Za-z0-9]+$ ]]
            test -f "$directory/$scenario.log"
            grep -E '\[MaccyLifecycle\]' "$directory/$scenario.log" > "$RUNNER_TEMP/memory-results/$scenario.log"
            cp "$directory/footprint.csv" "$RUNNER_TEMP/memory-results/$scenario.csv"
            grep -E '(CONTRACTS_OK|INTERACTION_OK cycles=12)' "$directory/$scenario.log"
            grep -E "READY scenario=$scenario" "$directory/$scenario.log"
          done
      - name: Measure 240 cycles and five minutes of idle
        run: bash tests-cli/lifecycle/capture.sh "$RUNNER_TEMP/candidate/Maccy.app" "${{ matrix.label }}" 240 "$RUNNER_TEMP/memory-results"
      - name: Preserve the supplemental result including failed checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native26-control-${{ matrix.label }}
          path: ${{ runner.temp }}/memory-results/
          retention-days: 7

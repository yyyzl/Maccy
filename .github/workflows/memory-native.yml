name: Diagnose accumulated synthetic memory on ARM

on:
  push:
    branches: ['memory-native/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm:
    runs-on: macos-26-intel
    timeout-minutes: 30
    outputs:
      zip_sha: ${{ steps.package.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build the isolated ARM64 diagnostic candidate
        run: |
          set -euo pipefail
          xcodebuild -project Maccy.xcodeproj -scheme Maccy -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/WindowBuild" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=org.yyyzl.MaccyMemoryLifecycle \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) MEMORY_TRIAL MEMORY_LIFECYCLE' \
            'OTHER_LDFLAGS=$(inherited) -Wl,-dead_strip_dylibs' build
          app="$RUNNER_TEMP/WindowBuild/Build/Products/Release/Maccy.app"
          lipo "$app/Contents/MacOS/Maccy" -verify_arch arm64
          if otool -L "$app/Contents/MacOS/Maccy" | grep -Fq Sparkle.framework; then exit 1; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Maccy-retention.zip"
      - name: Record the exact package digest
        id: package
        run: echo "sha=$(shasum -a 256 "$RUNNER_TEMP/Maccy-retention.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Maccy-retention-candidate-arm64
          path: ${{ runner.temp }}/Maccy-retention.zip
          retention-days: 7
  compare:
    needs: build-arm
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM host and record the diagnostic source
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/memory-results"
          {
            sw_vers
            uname -m
            sysctl -n hw.memsize
            git rev-parse HEAD
            echo 'DIAGNOSTIC ONLY: accelerated 240 cycles, no-content heap and reference metadata, allocator comparison'
            swift -e 'import AppKit; print("Screen:", NSScreen.main?.frame as Any, "scale:", NSScreen.main?.backingScaleFactor as Any)'
          } | tee "$RUNNER_TEMP/memory-results/host.txt"
      - uses: actions/download-artifact@v4
        with:
          name: Maccy-retention-candidate-arm64
          path: ${{ runner.temp }}/candidate
      - name: Verify and sign this run's ARM64 Release candidate
        env:
          PACKAGE_SHA: ${{ needs.build-arm.outputs.zip_sha }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_SHA" =~ ^[0-9a-f]{64}$ ]]
          destination="$RUNNER_TEMP/candidate"
          echo "$PACKAGE_SHA  $destination/Maccy-retention.zip" | shasum -a 256 -c -
          ditto -x -k "$destination/Maccy-retention.zip" "$destination"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$destination/Maccy.app/Contents/Info.plist")" = org.yyyzl.MaccyMemoryLifecycle
          lipo "$destination/Maccy.app/Contents/MacOS/Maccy" -verify_arch arm64
          sed 's/$(PRODUCT_BUNDLE_IDENTIFIER)/org.yyyzl.MaccyMemoryLifecycle/g' Maccy/Maccy.entitlements > "$destination/entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.get-task-allow bool true' "$destination/entitlements.plist"
          codesign --force --deep --sign - --pagesize 16384 --options runtime \
            --entitlements "$destination/entitlements.plist" "$destination/Maccy.app"
          codesign --verify --deep --strict "$destination/Maccy.app"
      - name: Diagnose 240 accelerated mixed cycles and settled ownership
        run: bash tests-cli/lifecycle/retention.sh "$RUNNER_TEMP/candidate/Maccy.app" "$RUNNER_TEMP/memory-results"
      - name: Preserve synthetic metrics and no-content ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retention-diagnostics-arm64
          path: ${{ runner.temp }}/memory-results/
          retention-days: 7

name: Run native ARM memory comparison

on:
  push:
    branches: ['memory-native/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Verify ARM host and record the controlled build source
        run: |
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/memory-results"
          {
            sw_vers
            uname -m
            sysctl -n hw.memsize
            echo 'Build source: 0dddf7f7f725f0c4738e76a06d7748019bf3dd7a; run 41707607281; bulk production source 8da61bd'
            swift -e 'import AppKit; print("Screen:", NSScreen.main?.frame as Any, "scale:", NSScreen.main?.backingScaleFactor as Any)'
          } | tee "$RUNNER_TEMP/memory-results/host.txt"
      - name: Download and verify the paired ARM64 Release builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for variant in bulk candidate; do
            if [ "$variant" = bulk ]; then
              artifact_id=13266951047
              digest=b3789d5be54052e90dcb71f70837b7196ad78b338bd529cf2c83e0c4380dbb40
            else
              artifact_id=13267840273
              digest=ba0801e6eb5464f2d85dbd350e4ea42a8b31dd2e667549faf489fa04baa61bf5
            fi
            destination="$RUNNER_TEMP/$variant"
            mkdir -p "$destination"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$destination/artifact.zip"
            echo "$digest  $destination/artifact.zip" | shasum -a 256 -c -
            ditto -x -k "$destination/artifact.zip" "$destination/download"
            ditto -x -k "$destination/download/Maccy-lifecycle.zip" "$destination"
            sed 's/$(PRODUCT_BUNDLE_IDENTIFIER)/org.yyyzl.MaccyMemoryLifecycle/g' Maccy/Maccy.entitlements > "$destination/entitlements.plist"
            codesign --force --deep --sign - --pagesize 16384 --options runtime \
              --entitlements "$destination/entitlements.plist" "$destination/Maccy.app"
            codesign --verify --deep --strict "$destination/Maccy.app"
          done
      - name: Verify the original metadata and format contracts
        run: |
          set -euo pipefail
          for variant in bulk candidate; do
            set +e
            bash tests-cli/lifecycle/run.sh "$RUNNER_TEMP/$variant/Maccy.app" "$variant" contracts | tee "$RUNNER_TEMP/memory-results/contracts-$variant-console.log"
            set -e
            directory=$(sed -n 's/^Results: //p' "$RUNNER_TEMP/memory-results/contracts-$variant-console.log" | head -1)
            [[ "$directory" =~ ^/tmp/maccy-lifecycle-results\.[A-Za-z0-9]+$ ]]
            test -f "$directory/contracts.log"
            grep -E 'CONTRACTS_OK' "$directory/contracts.log"
            grep -E 'READY scenario=contracts' "$directory/contracts.log"
            grep -E '\[MaccyLifecycle\]' "$directory/contracts.log" > "$RUNNER_TEMP/memory-results/contracts-$variant.log"
          done
      - name: Measure the bulk-context version for 60 mixed cycles and five minutes of idle
        continue-on-error: true
        run: bash tests-cli/lifecycle/capture.sh "$RUNNER_TEMP/bulk/Maccy.app" bulk 60 "$RUNNER_TEMP/memory-results"
      - name: Measure candidate for the same workload and idle period
        id: candidate
        run: bash tests-cli/lifecycle/capture.sh "$RUNNER_TEMP/candidate/Maccy.app" candidate 60 "$RUNNER_TEMP/memory-results"
      - name: Preserve paired measurements including failed budgets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-comparison-arm64
          path: ${{ runner.temp }}/memory-results/
          retention-days: 7
      - name: Verify one hour of mixed operations after the candidate passes
        if: steps.candidate.outcome == 'success'
        run: bash tests-cli/lifecycle/capture.sh "$RUNNER_TEMP/candidate/Maccy.app" endurance 240 "$RUNNER_TEMP/memory-results"
      - name: Preserve the endurance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-memory-endurance-arm64
          path: ${{ runner.temp }}/memory-results/
          retention-days: 7

name: Verify Maccy memory optimization

on:
  push:
    branches:
      - 'memory-optimization/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and run isolated tests
    # ARM hosted runners can be capacity-constrained. Cross-compile on Intel;
    # the component tests below run natively on that runner.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build experimental app without signing
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MaccyDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app supports Apple Silicon
        run: |
          lipo -verify_arch arm64 \
            "$RUNNER_TEMP/MaccyDerivedData/Build/Products/Debug/Maccy.app/Contents/MacOS/Maccy"
          lipo -archs \
            "$RUNNER_TEMP/MaccyDerivedData/Build/Products/Debug/Maccy.app/Contents/MacOS/Maccy"

      - name: Run isolated regression tests
        run: |
          sh tests-cli/clipboard-metadata/run.sh
          sh tests-cli/image-resize/run.sh
          sh tests-cli/image-loader/run.sh
          sh tests-cli/decorator/run.sh

      - name: Package unsigned build for inspection
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MaccyDerivedData/Build/Products/Debug/Maccy.app" \
            "$RUNNER_TEMP/Maccy-unsigned-experimental.zip"

      - name: Upload unsigned experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-unsigned-experimental
          path: ${{ runner.temp }}/Maccy-unsigned-experimental.zip
          if-no-files-found: error
          retention-days: 7

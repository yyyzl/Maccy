name: Verify Maccy memory optimization

on:
  push:
    branches:
      - 'memory-optimization/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and run isolated tests
    # ARM hosted runners can be capacity-constrained. Cross-compile on Intel;
    # the component tests below run natively on that runner.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show macOS and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build experimental app without signing
        run: |
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/MaccySourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/MaccyDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app supports Apple Silicon
        run: |
          app="$RUNNER_TEMP/MaccyDerivedData/Build/Products/Debug/Maccy.app/Contents/MacOS/Maccy"
          lipo "$app" -verify_arch arm64
          lipo "$app" -archs

      - name: Run isolated regression tests
        run: |
          sh tests-cli/clipboard-metadata/run.sh
          sh tests-cli/image-resize/run.sh
          sh tests-cli/image-loader/run.sh
          sh tests-cli/decorator/run.sh
          sh tests-cli/smoke-compile/run.sh

      - name: Build baseline with the same isolated test harness
        run: |
          base=dec66013b1a6865608949845e8eabd85cff3fc29
          for file in \
            Maccy/ApplicationImageCache.swift \
            Maccy/Extensions/NSImage+Resized.swift \
            Maccy/Observables/History.swift \
            Maccy/Observables/HistoryItemDecorator.swift \
            Maccy/Views/HistoryItemView.swift; do
            git show "$base:$file" > "$file"
          done
          xcodebuild \
            -project Maccy.xcodeproj \
            -scheme Maccy \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/MaccySourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/MaccyBaselineDerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          app="$RUNNER_TEMP/MaccyBaselineDerivedData/Build/Products/Debug/Maccy.app/Contents/MacOS/Maccy"
          lipo "$app" -verify_arch arm64

      - name: Package unsigned builds for isolated comparison
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MaccyDerivedData/Build/Products/Debug/Maccy.app" \
            "$RUNNER_TEMP/Maccy-optimized-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/MaccyBaselineDerivedData/Build/Products/Debug/Maccy.app" \
            "$RUNNER_TEMP/Maccy-baseline-unsigned.zip"

      - name: Upload unsigned experimental artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Maccy-isolated-comparison-unsigned
          path: |
            ${{ runner.temp }}/Maccy-optimized-unsigned.zip
            ${{ runner.temp }}/Maccy-baseline-unsigned.zip
          if-no-files-found: error
          retention-days: 7
